<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 600px;
            margin-top: 50px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            background-color: #ffffff;
            border-radius: 10px;
        }
        h1 {
            color: #007bff;
        }
        .btn-custom {
            width: 100%;
            margin-bottom: 10px;
        }
        #waiting-icon {
            display: none; /* Hide by default */
            margin-top: 20px;
            text-align: center;
            font-size: 1.5rem;
            color: #0d6efd; /* Same color as spinner */
        }
        #waiting-icon .spinner-border {
            margin-right: 10px;
        }
        #output {
            font-family: monospace;
            white-space: pre;
            color: grey;
            margin-top: 10px;
        }
    </style>
 
</head>
<body>
    <div class="container text-center">
        <h1>{{ title }}</h1>
        <form id="file-form">
            <div class="mb-3">
                <input type="file" class="form-control" id="file-input" accept=".xlsx">
            </div>
            <button type="button" class="btn btn-primary btn-custom" id="upload-button">Upload</button>
            <button type="button" class="btn btn-secondary btn-custom" id="refine-button">Refine</button>
            <button type="button" class="btn btn-success btn-custom" id="prepare-button">Prepare</button>
            <button type="button" class="btn btn-info btn-custom" id="download-button" style="display: none;">Download</button>
        </form>
        <div id="output" class="mt-3"></div>
        <div id="waiting-icon" class="text-center">
            <div class="d-flex align-items-center justify-content-center">
                <div class="spinner-border text-primary" role="status"></div>
                <span>Processing...</span>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
    <script>
        let uploadedFilePath = '';  // Store the uploaded file path
        let downloadFileName = '';   // Store the filename to download

        function showWaitingIcon() {
            document.getElementById('waiting-icon').style.display = 'block';
            disableButtons();
        }

        function hideWaitingIcon() {
            document.getElementById('waiting-icon').style.display = 'none';
            enableButtons();
        }

        function disableButtons() {
            document.querySelectorAll('.btn-custom').forEach(btn => btn.disabled = true);
        }

        function enableButtons() {
            document.querySelectorAll('.btn-custom').forEach(btn => btn.disabled = false);
        }

        async function postRequest(endpoint, data) {
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data),
                });

                if (response.headers.get('Content-Type')?.includes('application/json')) {
                    return await response.json();
                } else {
                    const text = await response.text();
                    console.error(`Non-JSON response received: ${text}`);
                    throw new Error('Server returned a non-JSON response');
                }
            } catch (error) {
                console.error(`Error in postRequest: ${error}`);
                throw error;
            }
        }

        async function handleClick(event, endpoint) {
            showWaitingIcon();
            let result;
            try {
                const fileInput = document.getElementById('file-input');
                const file = fileInput.files[0];

                if (endpoint === '/upload') {
                    if (file) {
                        const formData = new FormData();
                        formData.append('file', file);
                        const response = await fetch(endpoint, { method: 'POST', body: formData });
                        const data = await response.json();
                        if (data.path) {
                            uploadedFilePath = data.path;
                            document.getElementById('output').innerHTML = `<b>${data.message}</b>`;
                        } else {
                            throw new Error('File upload failed.');
                        }
                    } else {
                        alert('No file selected');
                        throw new Error('No file selected');
                    }
                } else if (uploadedFilePath) {
                    result = await postRequest(endpoint, { file_path: uploadedFilePath });
                    document.getElementById('output').innerHTML = `<b>${result.message}</b>`;
                    if (result.filename) {
                        downloadFileName = result.filename;  // Store the filename to be downloaded
                        document.getElementById('download-button').style.display = 'block'; // Show download button
                    }
                } else {
                    alert('No file uploaded yet.');
                    throw new Error('No file uploaded yet.');
                }
            } catch (error) {
                console.error(error);
                document.getElementById('output').innerHTML = '<b>Error occurred. Please try again.</b>';
            } finally {
                hideWaitingIcon();
            }
        }

        document.getElementById('upload-button').addEventListener('click', (event) => handleClick(event, '/upload'));
        document.getElementById('refine-button').addEventListener('click', (event) => handleClick(event, '/refine'));
        document.getElementById('prepare-button').addEventListener('click', (event) => handleClick(event, '/prepare'));
        
        document.getElementById('download-button').addEventListener('click', () => {
            if (downloadFileName) {
                const link = document.createElement('a');
                link.href = `/download/${downloadFileName}`;  // Use the generated filename to create download URL
                link.download = downloadFileName;  // Optional: set filename for download
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } else {
                alert('No file available for download.');
            }
        });
    </script>
</body>
</html>
